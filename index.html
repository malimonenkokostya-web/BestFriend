<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>BestFriend — Tori ❤️</title>
  <style>
    :root {
      --bg: #0a0015;
      --pink: #ff4d8d;
      --purple: #a855f7;
      --gold: #fbbf24;
      --cyan: #06b6d4;
      --text: #fce7f3;
      --glass: rgba(15, 0, 30, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    body {
      background: var(--bg);
      /* Замена на системные шрифты для скорости */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Анимированный фон */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 0%, #1a0040 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #0d0025 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #150030 0%, transparent 60%);
      z-index: -1;
    }

    .bg-lines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
      opacity: 0.3;
    }
    .bg-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, var(--purple), transparent);
      height: 1px;
      width: 100%;
      animation: lineMove 8s infinite linear;
    }
    .bg-line:nth-child(1) { top: 20%; animation-delay: 0s; }
    .bg-line:nth-child(2) { top: 40%; animation-delay: -2s; }
    .bg-line:nth-child(3) { top: 60%; animation-delay: -4s; }
    .bg-line:nth-child(4) { top: 80%; animation-delay: -6s; }
    @keyframes lineMove {
      0% { transform: translateX(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }

    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatUp 8s infinite ease-in;
      opacity: 0;
      will-change: transform, opacity;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.8); opacity: 0; }
    }

    .scene {
      width: 100%;
      max-width: 700px;
      padding: 20px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .section {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }
    .section.active {
      display: flex;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== ЗАСТАВКА ===== */
    .intro-logo {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 20px var(--pink), 0 0 40px var(--pink), 0 0 80px var(--purple);
      letter-spacing: 6px;
      margin-bottom: 8px;
      animation: glowPulse 3s infinite ease-in-out;
    }
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 20px var(--pink), 0 0 40px var(--pink), 0 0 80px var(--purple); }
      50% { text-shadow: 0 0 30px var(--pink), 0 0 60px var(--pink), 0 0 120px var(--purple); }
    }

    .intro-subtitle {
      font-size: clamp(16px, 3.5vw, 22px);
      font-weight: 300;
      color: #fce7f3;
      letter-spacing: 5px;
      text-shadow: 0 0 20px var(--purple);
      margin-bottom: 12px;
      opacity: 0.9;
    }

    .intro-hearts {
      font-size: clamp(30px, 7vw, 45px);
      margin: 15px 0 20px;
      animation: heartFloat 2.5s infinite ease-in-out;
    }
    @keyframes heartFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-15px) scale(1.1); }
      75% { transform: translateY(-5px) scale(0.95); }
    }

    .intro-divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--pink));
      border-radius: 5px;
      margin: 5px 0 25px;
      box-shadow: 0 0 25px var(--pink);
      animation: dividerShine 2s infinite;
    }

    .btn {
      padding: 15px 35px;
      border-radius: 50px;
      font-weight: 700;
      font-size: clamp(15px, 3vw, 18px);
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
      outline: none;
      position: relative;
      overflow: hidden;
    }
    .btn:active { transform: scale(0.93); }

    .btn-primary {
      background: linear-gradient(135deg, #ff4d8d 0%, #a855f7 100%);
      color: #fff;
      box-shadow: 0 8px 35px rgba(255, 77, 141, 0.5);
    }
    .btn-ghost {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fce7f3;
      backdrop-filter: blur(10px);
    }
    .btn-skip { transition: all 0.1s ease-out; }

    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0;
    }

    .swipe-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      margin-top: 10px;
      animation: swipeHint 2s infinite;
    }
    @keyframes swipeHint {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(10px); }
    }

    .question-text {
      font-weight: 800;
      font-size: clamp(22px, 5vw, 28px);
      color: #fff;
      text-shadow: 0 0 30px var(--purple);
      margin: 25px 0;
      letter-spacing: 2px;
      line-height: 1.5;
    }

    .cat-img {
      font-size: clamp(80px, 18vw, 120px);
      margin: 20px 0;
      animation: catBounce 0.8s infinite;
    }
    @keyframes catBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.1); }
    }

    .terminal {
      background: #000a00;
      border: 2px solid #33ff33;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      min-height: 200px;
      box-shadow: 0 0 40px rgba(51, 255, 51, 0.25);
      font-family: 'Courier New', Courier, monospace;
      color: #33ff33;
      font-size: clamp(10px, 2.5vw, 13px);
      line-height: 1.8;
      white-space: pre-wrap;
      text-align: left;
      position: relative;
    }
    .cursor::after {
      content: "_";
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .heart-loader {
      font-size: clamp(60px, 15vw, 90px);
      margin: 25px 0;
      animation: heartBeat 0.7s infinite;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
    }

    .progress-bar {
      width: 85%;
      max-width: 400px;
      height: 24px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      margin: 15px 0;
      border: 2px solid rgba(255, 77, 141, 0.5);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff3366, #ff6b9d);
      transition: width 0.3s ease;
    }

    .hearts-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: clamp(24px, 6vw, 34px);
      margin: 25px 0;
    }

    .dedication-text {
      font-family: "Pacifico", "Brush Script MT", cursive;
      font-size: clamp(22px, 5vw, 28px);
      color: #fff;
      text-shadow: 0 0 25px var(--pink);
    }

    .player-box {
      background: var(--glass);
      backdrop-filter: blur(30px);
      border-radius: 30px;
      padding: 25px 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      width: 100%;
    }
    .lyrics-box {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 18px;
      padding: 15px;
      margin: 12px 0;
      max-height: 140px;
      overflow-y: auto;
      color: #f5d0fe;
      font-weight: 600;
      font-size: clamp(15px, 3vw, 17px);
      line-height: 1.9;
    }
    .highlight-lyric {
      color: #fbbf24;
      padding: 3px 12px;
      text-shadow: 0 0 12px var(--gold);
    }

    .final-box {
      background: linear-gradient(160deg, #1a001a, #0d0015);
      border-radius: 28px;
      padding: 28px 18px;
      border: 2px solid #ff4d6d;
      max-height: 400px;
      overflow-y: auto;
      color: #fce4ec;
      font-size: clamp(14px, 3vw, 16px);
      line-height: 2;
      text-align: left;
    }
  </style>
</head>
<body>

<div class="bg-lines"><div class="bg-line"></div><div class="bg-line"></div><div class="bg-line"></div><div class="bg-line"></div></div>
<div class="particles" id="particlesContainer"></div>

<div class="scene">
  <div class="section active" id="secIntro">
    <div class="intro-logo">BestFriend</div>
    <div class="intro-subtitle">Tori it's for you</div>
    <div class="intro-divider"></div>
    <div class="intro-hearts">💗💖💗</div>
    <div class="btn-group">
      <button class="btn btn-primary" id="btnAsk">💌 Узнать что?</button>
      <button class="btn btn-ghost btn-skip" id="btnSkip">Пропустить</button>
    </div>
    <div class="swipe-hint">↔ свайпай дальше →</div>
  </div>

  <div class="section" id="secQuestion">
    <div class="question-text">Ты считаешь меня своим лучшим другом?</div>
    <div class="btn-group">
      <button class="btn btn-primary" id="btnYes">Да ❤️</button>
      <button class="btn btn-ghost" id="btnNo">Нет 😢</button>
    </div>
    <div id="noMsg" style="display:none; margin-top:20px;"></div>
  </div>

  <div class="section" id="secCat">
    <div class="cat-img" id="catEmoji"></div>
    <div class="cat-msg" id="catMsg"></div>
    <button class="btn btn-primary" id="btnContinue" style="margin-top:20px; display:none;">Продолжить ✨</button>
  </div>

  <div class="section" id="secTerminal">
    <div class="terminal" id="terminalDisplay"></div>
    <div class="btn-group" id="termBtns" style="margin-top:20px; display:none;">
      <button class="btn btn-primary" data-choice="1">1. best+friend</button>
      <button class="btn btn-ghost" data-choice="2">2. no friend</button>
    </div>
    <div id="termError" style="color:#ff4d6d; margin-top:10px; font-weight:700; display:none;"></div>
  </div>

  <div class="section" id="secHeartLoad">
    <div class="heart-loader">❤️</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0%</div>
  </div>

  <div class="section" id="secHearts">
    <div class="hearts-grid" id="heartsGrid"></div>
    <div class="dedication-text">Это для Тори от Кости ❤️</div>
    <button class="btn btn-primary" id="btnPlayMusic" style="margin-top:15px;">🎵 Включить музыку</button>
  </div>

  <div class="section" id="secPlayer">
    <div class="player-box">
      <div style="font-size:30px;">🎧</div>
      <div class="now-playing" id="nowPlaying">▶ тёмный принц — Ты пахнешь цветами</div>
      <audio id="audioPlayer" controls preload="auto"></audio>
      <div class="lyrics-box" id="lyricsDisplay">🎤 нажми play</div>
    </div>
    <button class="btn btn-primary" id="btnFinal" style="margin-top:20px;">💭 Посмотреть, что я думаю о тебе</button>
  </div>

  <div class="section" id="secFinal">
    <div class="final-box" id="finalWords"></div>
  </div>
</div>

<script>
(function() {
  const pc = document.getElementById('particlesContainer');
  for (let i = 0; i < 30; i++) {
    const d = document.createElement('div');
    d.classList.add('particle');
    const size = Math.random() * 6 + 2;
    d.style.width = size + 'px'; d.style.height = size + 'px';
    d.style.left = Math.random() * 100 + '%';
    d.style.background = ['#ff4d8d','#a855f7','#fbbf24'][Math.floor(Math.random() * 3)];
    d.style.animationDelay = Math.random() * 10 + 's';
    d.style.animationDuration = (Math.random() * 10 + 7) + 's';
    pc.appendChild(d);
  }

  const sections = {
    intro: document.getElementById('secIntro'),
    question: document.getElementById('secQuestion'),
    cat: document.getElementById('secCat'),
    terminal: document.getElementById('secTerminal'),
    load: document.getElementById('secHeartLoad'),
    hearts: document.getElementById('secHearts'),
    player: document.getElementById('secPlayer'),
    final: document.getElementById('secFinal')
  };

  function showSection(sec) {
    Object.values(sections).forEach(s => s.classList.remove('active'));
    sec.classList.add('active');
    sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  document.getElementById('btnAsk').onclick = () => showSection(sections.question);

  const btnSkip = document.getElementById('btnSkip');
  btnSkip.onmouseover = () => {
    btnSkip.style.position = 'fixed';
    btnSkip.style.left = Math.random() * (window.innerWidth - 100) + 'px';
    btnSkip.style.top = Math.random() * (window.innerHeight - 50) + 'px';
  };
  btnSkip.onclick = () => showSection(sections.question);

  document.getElementById('btnYes').onclick = () => {
    showSection(sections.cat);
    document.getElementById('catEmoji').textContent = '😸';
    document.getElementById('catMsg').textContent = 'Я не сомневался! ❤️';
    document.getElementById('btnContinue').style.display = 'inline-block';
  };

  document.getElementById('btnNo').onclick = () => {
    const msg = document.getElementById('noMsg');
    msg.style.display = 'block';
    msg.innerHTML = '<div class="cat-img">😿</div><div class="cat-msg">Подумай ещё... 💔</div>';
    document.getElementById('btnYes').textContent = 'Да, ты мой лучший друг! ❤️';
  };

  document.getElementById('btnContinue').onclick = () => {
    showSection(sections.terminal);
    startTerminal();
  };

  async function startTerminal() {
    const lines = ["./init_friendship...", "Tori module: OK", "Kostia module: OK", "Calc: Tori + Kostia = ?", "Select choice:"];
    const display = document.getElementById('terminalDisplay');
    for (let l of lines) {
      display.innerHTML += l + '\n';
      await new Promise(r => setTimeout(r, 400));
    }
    document.getElementById('termBtns').style.display = 'flex';
  }

  document.getElementById('termBtns').onclick = (e) => {
    if (e.target.dataset.choice === '1') {
      showSection(sections.load);
      startLoading();
    } else {
      const err = document.getElementById('termError');
      err.style.display = 'block';
      err.textContent = '⚠ ОШИБКА! Выбери вариант 1!';
    }
  };

  function startLoading() {
    let p = 0;
    const fill = document.getElementById('progressFill');
    const txt = document.getElementById('progressText');
    const int = setInterval(() => {
      p += 2;
      fill.style.width = p + '%';
      txt.textContent = p + '%';
      if (p >= 100) {
        clearInterval(int);
        setTimeout(() => { showSection(sections.hearts); fillHearts(); }, 500);
      }
    }, 50);
  }

  function fillHearts() {
    const grid = document.getElementById('heartsGrid');
    for (let i = 0; i < 40; i++) {
      const s = document.createElement('span');
      s.textContent = '❤️';
      s.style.animationDelay = Math.random() * 2 + 's';
      grid.appendChild(s);
    }
  }

  const audio = document.getElementById('audioPlayer');
  document.getElementById('btnPlayMusic').onclick = () => {
    showSection(sections.player);
    audio.src = 'music.mp3';
    audio.play().catch(() => { alert("Нажми Play в плеере!"); });
  };

  const hundredWords = [
    "Ты самый добрый человек.", "Твоя улыбка освещает дни.", "Ты красивая снаружи и внутри.", 
    "Ты умная.", "Ты сильная духом.", "Ты умеешь слушать.", "Твой смех — лекарство.",
    "Ты верный друг.", "Ты вдохновляешь.", "Ты честная.", "Ты умеешь прощать.",
    "Ты делаешь мир теплее.", "Ты ценишь мелочи.", "Ты амбициозная.", "Ты настоящая.",
    "Ты умеешь удивлять.", "Ты даришь тепло.", "С тобой можно говорить вечно.",
    "Я тебе доверяю.", "Ты не осуждаешь.", "Ты мотивируешь.", "С тобой весело.",
    "Ты ценишь дружбу.", "Ты невероятно талантливая.", "Ты видишь красоту.",
    "Ты заслуживаешь лучшего.", "Твоя искренность — сокровище.", "Ты — мой лучший друг.",
    "Рад, что мы знакомы, Тори! ❤️"
  ];

  document.getElementById('btnFinal').onclick = () => {
    showSection(sections.final);
    document.getElementById('finalWords').innerHTML = '<ol>' + hundredWords.map(w => '<li>'+w+'</li>').join('') + '</ol>';
  };
})();
</script>
</body>
</html>
