<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TORI_STATION_FINAL</title>
    <style>
        :root {
            --accent: #7d5fff;
            --secondary: #ff4d8d;
            --trit: #00d2ff;
            --bg-dark: #080810;
            --surface: rgba(16, 16, 28, 0.9);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-dark);
            color: #e0e0e0;
            font-family: var(--font);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #v-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        .app-shell {
            width: 96vw;
            height: 92vh;
            background: var(--surface);
            border: 1px solid rgba(125, 95, 255, 0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .top-bar {
            padding: 12px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--accent);
        }

        .view-port { flex: 1; position: relative; overflow: hidden; }

        .view {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .view.active { display: flex; animation: v-in 0.5s ease-out forwards; }

        @keyframes v-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .h-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .c-button {
            padding: 14px 32px;
            background: transparent;
            border: 1px solid var(--accent);
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            border-radius: 4px;
        }

        .c-button:hover {
            background: var(--accent);
            box-shadow: 0 0 25px rgba(125, 95, 255, 0.4);
        }

        .t-wrap {
            width: 90%;
            height: 75%;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            color: var(--trit);
            overflow-y: auto;
            text-align: left;
            font-size: 13px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }

        .k-ui {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.02);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .l-flow {
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 30px;
        }

        .l-line {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.1);
            transition: 0.3s;
            margin: 4px 0;
        }

        .l-line.on {
            color: var(--secondary);
            font-size: 1.8rem;
            text-shadow: 0 0 20px rgba(255, 77, 141, 0.5);
            font-weight: 700;
        }

        .r-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            padding: 20px;
        }

        .r-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 16px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid transparent;
            transition: 0.2s;
            text-align: left;
        }

        .r-card:hover {
            border-color: var(--accent);
            background: rgba(125, 95, 255, 0.05);
        }

        .r-card b { color: var(--accent); margin-right: 8px; }

        #no-btn { position: relative; transition: 0.1s; }
    </style>
</head>
<body>

    <canvas id="v-canvas"></canvas>

    <div class="app-shell">
        <div class="top-bar">
            <div id="sys-load">SYSTEM: OPTIMIZED // LATENCY: 0.002ms</div>
            <div id="clock">00:00:00</div>
        </div>

        <div class="view-port">
            <div class="view active" id="v1">
                <h1 class="h-title">TORI</h1>
                <p style="color: #888; margin-bottom: 2rem; letter-spacing: 1px;">PRIVATE_CONNECTION_ESTABLISHED</p>
                <button class="c-button" onclick="go(2)">RUN_INIT</button>
            </div>

            <div class="view" id="v2">
                <h2 style="margin-bottom: 2rem;">AUTH_REQUIRED: Мы лучшие друзья?</h2>
                <div style="display: flex; gap: 20px;">
                    <button class="c-button" onclick="go(3)">AFFIRMATIVE</button>
                    <button class="c-button" id="no-btn" onmouseover="dodge()">NEGATIVE</button>
                </div>
            </div>

            <div class="view" id="v3">
                <div class="t-wrap" id="t-out"></div>
                <button class="c-button" id="t-next" style="display:none; margin-top: 20px;" onclick="go(4)">OPEN_STREAM</button>
            </div>

            <div class="view" id="v4">
                <div class="k-ui">
                    <div class="l-flow" id="l-box">
                        <div class="l-line" id="l-1">READY</div>
                        <div class="l-line on" id="l-2">SYNCING...</div>
                        <div class="l-line" id="l-3">...</div>
                    </div>
                    <audio id="player" src="music.mp3"></audio>
                    <button class="c-button" onclick="playback()" id="p-ctrl">START_AUDIO</button>
                </div>
                <button class="c-button" onclick="go(5)" style="margin-top: 2rem; border-color: var(--secondary); color: var(--secondary);">LAST_PACKET</button>
            </div>

            <div class="view" id="v5">
                <div class="r-grid" id="r-out"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('v-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, dots = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        for(let i=0; i<60; i++) {
            dots.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = 'rgba(125, 95, 255, 0.1)';
            ctx.beginPath();
            dots.forEach((d, i) => {
                d.x += d.vx; d.y += d.vy;
                if(d.x < 0 || d.x > w) d.vx *= -1;
                if(d.y < 0 || d.y > h) d.vy *= -1;
                ctx.moveTo(d.x, d.y);
                dots.forEach(d2 => {
                    let dist = Math.hypot(d.x - d2.x, d.y - d2.y);
                    if(dist < 150) ctx.lineTo(d2.x, d2.y);
                });
            });
            ctx.stroke();
            requestAnimationFrame(draw);
        }
        draw();

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        function go(s) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const target = document.getElementById(`v${s}`);
            target.classList.add('active');
            if(s === 3) type();
            if(s === 5) loadR();
        }

        function dodge() {
            const b = document.getElementById('no-btn');
            b.style.left = Math.random() * 200 - 100 + 'px';
            b.style.top = Math.random() * 200 - 100 + 'px';
        }

        async function type() {
            const out = document.getElementById('t-out');
            const data = [
                "> BOOTING...", "> SCANNING_ID: TORI", "> STATUS: LEGENDARY", "> DECRYPTING_HEART...",
                " ", "      ****** ******", "    ** ** ** **",
                "   ** ** **", "   ** **", "    ** **",
                "      ** **", "        ** **", "          ** **", "            ** **", "              **",
                " ", "> MESSAGE: Ты лучший человек в моей жизни.", "> COMPLETE."
            ];
            for(let l of data) {
                out.innerText += l + "\n";
                out.scrollTop = out.scrollHeight;
                await new Promise(r => setTimeout(r, 80));
            }
            document.getElementById('t-next').style.display = 'block';
        }

        const player = document.getElementById('player');
        const sync = [
            {t: 0.0, txt: "ВХОДЯЩИЙ ПОТОК..."},
            {t: 2.1, txt: "Ну а ты пахнешь цветами..."},
            {t: 6.3, txt: "Самыми вкусными травами..."},
            {t: 10.5, txt: "Самыми яркими красками..."},
            {t: 14.8, txt: "Как глоток пива «Дон»"},
            {t: 19.2, txt: "Твой толер выше, чем у других..."},
            {t: 24.8, txt: "На двоих алкоголя хватило бы..."},
            {t: 31.5, txt: "Я твой личный маньяк..."},
            {t: 39.0, txt: "Ищу тебя по твоим следам..."},
            {t: 45.0, txt: "ВЕДЬ ТЫ ПАХНЕШЬ ЦВЕТАМИ! ❤️"}
        ];

        function playback() {
            const btn = document.getElementById('p-ctrl');
            if(player.paused) { player.play(); btn.innerText = "STOP_AUDIO"; }
            else { player.pause(); btn.innerText = "START_AUDIO"; }
        }

        player.ontimeupdate = () => {
            const time = player.currentTime;
            const idx = sync.findIndex((s, i) => time >= s.t && (!sync[i+1] || time < sync[i+1].t));
            if(idx !== -1) {
                document.getElementById('l-1').innerText = sync[idx-1] ? sync[idx-1].txt : "";
                document.getElementById('l-2').innerText = sync[idx].txt;
                document.getElementById('l-3').innerText = sync[idx+1] ? sync[idx+1].txt : "";
            }
        };

        function loadR() {
            const box = document.getElementById('r-out');
            if(box.children.length > 0) return;
            const reasons = [
                "Ты понимаешь меня с полуслова", "Твоя энергия заряжает", "Ты никогда не осудишь", 
                "У тебя редкое чувство юмора", "Ты умеешь делать день лучше", "Ты честная",
                "Твой вкус в музыке — база", "Ты сильная и это круто", "Ты умеешь слушать", 
                "Ты настоящая", "С тобой просто", "Ты всегда поддержишь", "Ты красивая",
                "Ты уникальная", "Ты умеешь прощать", "Ты вдохновляешь", "Ты — это ты",
                "Ты очень умная", "Ты не боишься быть собой", "Ты ценишь мелочи",
                "Ты — мой лучший выбор в друзьях", "Ты заслуживаешь счастья", "Ты верная",
                "Твой смех лечит", "Ты мастер сюрпризов", "Ты — душа", "Ты — космос",
                "Ты заставляешь меня расти", "Ты видишь мир иначе", "Ты — подарок судьбы",
                "Ты — мой надежный тыл", "Ты умеешь удивлять", "Ты — чистый позитив",
                "Ты — сокровище", "Ты не такая как все", "Ты умеешь сопереживать",
                "Ты — причина этой улыбки", "Ты — моя бро", "Ты просто лучшая",
                "Я горжусь нашей дружбой", "Ты не сдаешься", "Ты очень добрая",
                "Ты умеешь убеждать", "С тобой не страшно", "Ты — мой компас",
                "Ты — редкий человек", "Ты умеешь дарить тепло", "Ты — моя мотивация",
                "Ты — свет", "Ты умеешь ценить моменты", "Ты — человек-магнит",
                "Ты всегда находишь слова", "Ты — мой safe place", "Ты — невероятная Тори",
                "С тобой любая проблема — фигня", "Ты — мастер комплиментов", "Ты — огонь",
                "Ты — легенда", "Ты умеешь мечтать", "Ты — моя опора",
                "Ты — лучшая версия друга", "Ты понимаешь мои загоны", "Ты — золото",
                "Ты — мой антидепрессант", "Ты — просто вау", "Ты — искренняя",
                "Ты не бросишь", "Ты — часть моей истории", "Ты — мой самый близкий",
                "Ты умеешь вдохнуть жизнь", "Ты — мой идеал подруги", "Ты — супер",
                "Ты — невероятная", "Ты умеешь видеть суть", "Ты — мой герой",
                "Ты — яркая вспышка", "Ты — надежность", "Ты — бесконечность",
                "Ты — мастер на все руки", "Ты — моя гордость", "Ты — радость",
                "Ты — тот, кому я верю", "Ты — моя сила", "Ты — счастье",
                "Ты — неповторимая", "Ты — стильная", "Ты — мудрая",
                "Ты — глубокая", "Ты — мой мир", "Ты — успех",
                "Ты — гармония", "Ты — характер", "Ты — доброта",
                "Ты — честность", "Ты — верность", "Ты — луч",
                "Ты — мечта", "Ты — Космос", "Ты — Моя Тори", "Навсегда."
            ];
            reasons.forEach((r, i) => {
                const c = document.createElement('div');
                c.className = 'r-card';
                c.innerHTML = `<b>${(i+1).toString().padStart(2,'0')}</b> ${r}`;
                box.appendChild(c);
            });
        }
    </script>
</body>
</html>
