<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>BestFriend — Tori ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Russo+One&family=Montserrat:wght@300;400;600;700;800&family=Pacifico&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0015;
      --pink: #ff4d8d;
      --purple: #a855f7;
      --gold: #fbbf24;
      --cyan: #06b6d4;
      --text: #fce7f3;
      --glass: rgba(15, 0, 30, 0.85);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    body {
      background: var(--bg);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Анимированный фон */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 0%, #1a0040 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #0d0025 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #150030 0%, transparent 60%);
      z-index: -1;
    }

    /* Линии на фоне */
    .bg-lines {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
      opacity: 0.3;
    }
    .bg-line {
      position: absolute;
      background: linear-gradient(90deg, transparent, var(--purple), transparent);
      height: 1px;
      width: 100%;
      animation: lineMove 8s infinite linear;
    }
    .bg-line:nth-child(1) { top: 20%; animation-delay: 0s; }
    .bg-line:nth-child(2) { top: 40%; animation-delay: -2s; }
    .bg-line:nth-child(3) { top: 60%; animation-delay: -4s; }
    .bg-line:nth-child(4) { top: 80%; animation-delay: -6s; }
    @keyframes lineMove {
      0% { transform: translateX(-100%); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }

    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatUp 8s infinite ease-in;
      opacity: 0;
      will-change: transform, opacity;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.8); opacity: 0; }
    }

    .scene {
      width: 100%;
      max-width: 700px;
      padding: 20px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .section {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeSlide 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, opacity;
    }
    .section.active {
      display: flex;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== ЗАСТАВКА ===== */
    .intro-logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(36px, 8vw, 56px);
      font-weight: 700;
      color: #fff;
      text-shadow:
        0 0 20px var(--pink),
        0 0 40px var(--pink),
        0 0 80px var(--purple),
        0 0 120px var(--purple);
      letter-spacing: 6px;
      margin-bottom: 8px;
      animation: glowPulse 3s infinite ease-in-out;
    }
    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 20px var(--pink), 0 0 40px var(--pink), 0 0 80px var(--purple); }
      50% { text-shadow: 0 0 30px var(--pink), 0 0 60px var(--pink), 0 0 120px var(--purple), 0 0 160px var(--purple); }
    }

    .intro-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(16px, 3.5vw, 22px);
      font-weight: 300;
      color: #fce7f3;
      letter-spacing: 5px;
      text-shadow: 0 0 20px var(--purple);
      margin-bottom: 12px;
      opacity: 0.9;
    }

    .intro-hearts {
      font-size: clamp(30px, 7vw, 45px);
      margin: 15px 0 20px;
      animation: heartFloat 2.5s infinite ease-in-out;
    }
    @keyframes heartFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-15px) scale(1.1); }
      75% { transform: translateY(-5px) scale(0.95); }
    }

    .intro-divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, var(--pink), var(--purple), var(--pink));
      border-radius: 5px;
      margin: 5px 0 25px;
      box-shadow: 0 0 25px var(--pink);
      animation: dividerShine 2s infinite;
    }
    @keyframes dividerShine {
      0%, 100% { box-shadow: 0 0 25px var(--pink); }
      50% { box-shadow: 0 0 50px var(--pink), 0 0 75px var(--purple); }
    }

    /* ===== КНОПКИ ===== */
    .btn {
      padding: 15px 35px;
      border-radius: 50px;
      font-weight: 700;
      font-size: clamp(15px, 3vw, 18px);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 2px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      position: relative;
      overflow: hidden;
    }
    .btn:active {
      transform: scale(0.93);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff4d8d 0%, #a855f7 100%);
      color: #fff;
      box-shadow: 0 8px 35px rgba(255, 77, 141, 0.5);
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: rotate(45deg);
      animation: btnShine 3s infinite;
    }
    @keyframes btnShine {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    .btn-ghost {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: #fce7f3;
      backdrop-filter: blur(10px);
    }
    .btn-ghost:hover {
      border-color: var(--pink);
      box-shadow: 0 0 30px rgba(255, 77, 141, 0.3);
    }

    .btn-skip {
      transition: all 0.1s ease-out;
      will-change: transform, left, top;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0;
    }

    /* ===== ГОРИЗОНТАЛЬНЫЙ СВАЙП-КОНТЕЙНЕР ===== */
    .swipe-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      margin-top: 10px;
      animation: swipeHint 2s infinite;
    }
    @keyframes swipeHint {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(10px); }
    }

    /* ===== ВОПРОС ===== */
    .question-text {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(22px, 5vw, 28px);
      color: #fff;
      text-shadow: 0 0 30px var(--purple), 0 0 60px var(--purple);
      margin: 25px 0;
      letter-spacing: 2px;
      line-height: 1.5;
      animation: questionPulse 2s infinite;
    }
    @keyframes questionPulse {
      0%, 100% { text-shadow: 0 0 30px var(--purple), 0 0 60px var(--purple); }
      50% { text-shadow: 0 0 45px var(--purple), 0 0 90px var(--purple), 0 0 120px var(--pink); }
    }

    /* ===== КОТИКИ ===== */
    .cat-img {
      font-size: clamp(80px, 18vw, 120px);
      margin: 20px 0;
      animation: catBounce 0.8s infinite;
    }
    @keyframes catBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-20px) scale(1.1); }
      60% { transform: translateY(-5px) scale(0.95); }
    }
    .cat-msg {
      font-size: clamp(18px, 4vw, 24px);
      font-weight: 700;
      color: #fce7f3;
      margin: 10px 0;
      text-shadow: 0 0 20px var(--pink);
    }

    /* ===== ТЕРМИНАЛ ===== */
    .terminal {
      background: #000a00;
      border: 2px solid #33ff33;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      min-height: 200px;
      box-shadow:
        0 0 40px rgba(51, 255, 51, 0.25),
        inset 0 0 40px rgba(51, 255, 51, 0.03);
      font-family: 'Press Start 2P', monospace;
      color: #33ff33;
      font-size: clamp(9px, 2vw, 11px);
      line-height: 2.2;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .terminal::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 255, 0, 0.02) 2px,
        rgba(0, 255, 0, 0.02) 4px
      );
      pointer-events: none;
    }
    .cursor::after {
      content: "_";
      animation: blink 1s infinite;
      font-weight: bold;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ===== ЗАГРУЗКА СЕРДЦА ===== */
    .heart-loader {
      font-size: clamp(60px, 15vw, 90px);
      margin: 25px 0;
      filter: drop-shadow(0 0 40px #ff3366) drop-shadow(0 0 80px #ff3366);
      animation: heartBeat 0.7s infinite;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }
    .progress-bar {
      width: 85%;
      max-width: 400px;
      height: 24px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      margin: 15px 0;
      border: 2px solid rgba(255, 77, 141, 0.5);
      box-shadow: 0 0 30px rgba(255, 77, 141, 0.4);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff3366, #ff6b9d, #ff3366);
      background-size: 200% 100%;
      animation: progressShine 2s infinite linear;
      border-radius: 20px;
      transition: width 0.3s ease;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.3);
    }
    @keyframes progressShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .progress-text {
      color: #fce7f3;
      font-weight: 700;
      font-size: clamp(18px, 4vw, 22px);
    }

    /* ===== ЭКРАН СЕРДЕЧЕК ===== */
    .hearts-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: clamp(24px, 6vw, 34px);
      margin: 25px 0;
      max-width: 100%;
      padding: 10px;
    }
    .hearts-grid span {
      animation: heartPop 2s infinite;
    }
    @keyframes heartPop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .dedication-text {
      font-family: 'Pacifico', cursive;
      font-size: clamp(22px, 5vw, 28px);
      color: #fff;
      text-shadow: 0 0 25px var(--pink), 0 0 50px var(--pink);
      margin: 15px 0;
    }

    /* ===== ПЛЕЕР ===== */
    .player-box {
      background: var(--glass);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 30px;
      padding: 25px 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      width: 100%;
      box-shadow: 0 20px 60px rgba(180, 0, 255, 0.3);
    }
    .now-playing {
      color: var(--gold);
      font-weight: 700;
      font-size: clamp(13px, 2.8vw, 16px);
      margin: 8px 0;
      text-shadow: 0 0 15px var(--gold);
    }
    audio {
      width: 100%;
      max-width: 400px;
      border-radius: 30px;
      margin: 10px 0;
      outline: none;
    }
    .lyrics-box {
      background: rgba(0, 0, 0, 0.6);
      border-radius: 18px;
      padding: 15px;
      margin: 12px 0;
      max-height: 140px;
      overflow-y: auto;
      color: #f5d0fe;
      font-weight: 600;
      font-size: clamp(15px, 3vw, 17px);
      line-height: 1.9;
      border: 1px solid rgba(168, 133, 250, 0.4);
    }
    .highlight-lyric {
      color: #fbbf24;
      font-weight: 800;
      background: rgba(168, 85, 247, 0.35);
      border-radius: 8px;
      padding: 3px 12px;
      text-shadow: 0 0 12px var(--gold);
    }

    /* ===== ФИНАЛ ===== */
    .final-box {
      background: linear-gradient(160deg, #1a001a, #0d0015);
      border-radius: 28px;
      padding: 28px 18px;
      border: 2px solid #ff4d6d;
      box-shadow: 0 0 60px rgba(255, 51, 102, 0.4);
      max-height: 380px;
      overflow-y: auto;
      color: #fce4ec;
      font-size: clamp(14px, 2.8vw, 16px);
      line-height: 2.1;
      text-align: left;
    }
    .final-box ol {
      padding-left: 20px;
    }
    .final-box li {
      margin-bottom: 6px;
      padding: 2px 0;
    }

    /* Скроллбар */
    ::-webkit-scrollbar {
      width: 3px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #a855f7;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<!-- Фоновые линии -->
<div class="bg-lines">
  <div class="bg-line"></div>
  <div class="bg-line"></div>
  <div class="bg-line"></div>
  <div class="bg-line"></div>
</div>

<!-- Частицы -->
<div class="particles" id="particlesContainer"></div>

<div class="scene">

  <!-- ===== 1. ЗАСТАВКА ===== -->
  <div class="section active" id="secIntro">
    <div class="intro-logo">BestFriend</div>
    <div class="intro-subtitle">Tori it's for you</div>
    <div class="intro-divider"></div>
    <div class="intro-hearts">💗💖💗</div>
    <div class="btn-group">
      <button class="btn btn-primary" id="btnAsk">💌 Узнать что?</button>
      <button class="btn btn-ghost btn-skip" id="btnSkip">Пропустить</button>
    </div>
    <div class="swipe-hint">↔ свайпай дальше →</div>
  </div>

  <!-- ===== 2. ВОПРОС ===== -->
  <div class="section" id="secQuestion">
    <div class="question-text">Ты считаешь меня своим лучшим другом?</div>
    <div class="btn-group">
      <button class="btn btn-primary" id="btnYes">Да ❤️</button>
      <button class="btn btn-ghost" id="btnNo">Нет 😢</button>
    </div>
    <div id="noMsg" style="display:none; margin-top:20px;"></div>
  </div>

  <!-- ===== 3. КОТИКИ ===== -->
  <div class="section" id="secCat">
    <div class="cat-img" id="catEmoji"></div>
    <div class="cat-msg" id="catMsg"></div>
    <button class="btn btn-primary" id="btnContinue" style="margin-top:20px; display:none;">Продолжить ✨</button>
  </div>

  <!-- ===== 4. ТЕРМИНАЛ ===== -->
  <div class="section" id="secTerminal">
    <div class="terminal" id="terminalDisplay"></div>
    <div class="btn-group" id="termBtns" style="margin-top:20px; display:none;">
      <button class="btn btn-primary" data-choice="1">1. best+friend</button>
      <button class="btn btn-ghost" data-choice="2">2. no friend</button>
    </div>
    <div id="termError" style="color:#ff4d6d; margin-top:10px; font-weight:700; display:none; font-size:16px;"></div>
  </div>

  <!-- ===== 5. ЗАГРУЗКА СЕРДЦА ===== -->
  <div class="section" id="secHeartLoad">
    <div class="heart-loader">❤️</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0%</div>
  </div>

  <!-- ===== 6. ЭКРАН СЕРДЕЧЕК ===== -->
  <div class="section" id="secHearts">
    <div class="hearts-grid" id="heartsGrid"></div>
    <div class="dedication-text">Это для Тори от Кости ❤️</div>
    <button class="btn btn-primary" id="btnPlayMusic" style="margin-top:15px;">🎵 Включить музыку</button>
  </div>

  <!-- ===== 7. ПЛЕЕР ===== -->
  <div class="section" id="secPlayer">
    <div class="player-box">
      <div style="font-size:30px;">🎧</div>
      <div class="now-playing" id="nowPlaying">▶ тёмный принц — Ты пахнешь цветами</div>
      <audio id="audioPlayer" controls preload="auto"></audio>
      <div class="lyrics-box" id="lyricsDisplay">🎤 нажми play</div>
    </div>
    <button class="btn btn-primary" id="btnFinal" style="margin-top:20px;">💭 Посмотреть, что я думаю о тебе</button>
  </div>

  <!-- ===== 8. ФИНАЛ ===== -->
  <div class="section" id="secFinal">
    <div class="final-box" id="finalWords"></div>
  </div>

</div>

  // ===== НАВИГАЦИЯ =====
  function showSection(sec) {
    const allSections = [secIntro, secQuestion, secCat, secTerminal, secHeartLoad, secHearts, secPlayer, secFinal];
    allSections.forEach(s => s.classList.remove('active'));
    // Форсим reflow для плавности
    void sec.offsetWidth;
    sec.classList.add('active');
    // Плавный скролл через requestAnimationFrame
    requestAnimationFrame(() => {
      sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  // ===== 1. ЗАСТАВКА → ВОПРОС =====
  document.getElementById('btnAsk').addEventListener('click', () => {
    showSection(secQuestion);
  });

  // Убегающая кнопка (оптимизированная)
  const btnSkip = document.getElementById('btnSkip');
  let skipMoving = false;
  
  function moveSkip() {
    if (skipMoving) return;
    skipMoving = true;
    
    const maxX = window.innerWidth - btnSkip.offsetWidth - 20;
    const maxY = window.innerHeight - btnSkip.offsetHeight - 20;
    
    btnSkip.style.position = 'fixed';
    btnSkip.style.left = Math.random() * maxX + 'px';
    btnSkip.style.top = Math.random() * maxY + 'px';
    btnSkip.style.zIndex = '999';
    
    requestAnimationFrame(() => {
      skipMoving = false;
    });
  }

  btnSkip.addEventListener('mouseover', moveSkip);
  btnSkip.addEventListener('touchstart', function(e) {
    e.preventDefault();
    moveSkip();
    setTimeout(() => showSection(secQuestion), 200);
  }, { passive: false });
  btnSkip.addEventListener('click', () => showSection(secQuestion));

  async function startTerminal() {
    terminalDisplay.innerHTML = '<span class="cursor"></span>';
    termBtns.style.display = 'none';
    termError.style.display = 'none';
    
    const lines = [
      "root@bestfriend:~$ ./init_friendship",
      "Загрузка модуля Tori... OK",
      "Загрузка модуля Kostia... OK",
      "Вычисление: Tori + Kostia = ?",
      "",
      "Выберите вариант:",
      "  [1] best+friend",
      "  [2] no friend"
    ];
    
    for (let i = 0; i < lines.length; i++) {
      terminalDisplay.innerHTML = lines.slice(0, i + 1).join('\n') + '<span class="cursor"></span>';
      await new Promise(r => setTimeout(r, 200));
    }
    termBtns.style.display = 'flex';
  }

  termBtns.addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON') return;
    if (e.target.dataset.choice === '1') {
      termBtns.style.display = 'none';
      termError.style.display = 'none';
      terminalDisplay.innerHTML += '\n\n>>> Результат: Tori + Kostia = ЛУЧШИЕ ДРУЗЬЯ ❤️\n>>> Инициализация загрузки...';
      setTimeout(() => {
        showSection(secHeartLoad);
        startHeartLoading();
      }, 1200);
    } else {
      termError.style.display = 'block';
      termError.textContent = '⚠ ОШИБКА! Выберите вариант 1!';
    }
  });

  // ===== 5. ЗАГРУЗКА СЕРДЦА =====
  function startHeartLoading() {
    let percent = 0;
    progressFill.style.width = '0%';
    progressText.textContent = '0%';
    
    const interval = setInterval(() => {
      percent += Math.floor(Math.random() * 6) + 1;
      if (percent >= 100) {
        percent = 100;
        clearInterval(interval);
        progressFill.style.width = '100%';
        progressText.textContent = '100% ❤️';
        setTimeout(() => {
          showSection(secHearts);
          fillHearts();
        }, 700);
      } else {
        progressFill.style.width = percent + '%';
        progressText.textContent = percent + '%';
      }
    }, 180);
  }

  // ===== 6. ЭКРАН СЕРДЕЧЕК =====
  function fillHearts() {
    const emojis = ['❤️','💖','💗','💕','💘','💝','💟','♥️','🩷','💓','💞','🫶'];
    let html = '';
    for (let i = 0; i < 50; i++) {
      const delay = (Math.random() * 2).toFixed(2);
      const dur = (0.6 + Math.random() * 1.4).toFixed(2);
      html += `<span style="animation-delay:${delay}s; animation-duration:${dur}s;">${emojis[Math.floor(Math.random() * emojis.length)]}</span>`;
    }
    heartsGrid.innerHTML = html;
  }

  // ===== 7. ПЛЕЕР =====
  document.getElementById('btnPlayMusic').addEventListener('click', () => {
    showSection(secPlayer);
    loadSong(0);
  });

  function loadSong(idx) {
    if (songSwitchTimeout) clearTimeout(songSwitchTimeout);
    currentSong = idx;
    const s = songs[idx];
    audioPlayer.src = s.src;
    audioPlayer.load();
    nowPlaying.textContent = '▶ ' + s.name;
    lyricsDisplay.innerHTML = '🎤 нажми play';
  }

  // Оптимизированный timeupdate через debounce
  let lastLyricUpdate = 0;
  audioPlayer.addEventListener('timeupdate', () => {
    const now = Date.now();
    if (now - lastLyricUpdate < 200) return;
    lastLyricUpdate = now;
    
    const s = songs[currentSong];
    const ct = audioPlayer.currentTime;
    let line = '';
    
    for (let i = s.lyrics.length - 1; i >= 0; i--) {
      if (ct >= s.lyrics[i].t) {
        line = s.lyrics[i].l;
        break;
      }
    }
    
    if (line) {
      lyricsDisplay.innerHTML = `<span class="highlight-lyric">${line}</span>`;
    }
    
    // Автопереключение на вторую песню
    if (currentSong === 0 && ct >= s.nextSongAt && !songSwitchTimeout) {
      songSwitchTimeout = setTimeout(() => {
        loadSong(1);
        audioPlayer.play().catch(() => {});
        nowPlaying.textContent = '▶ ' + songs[1].name + ' (авто)';
      }, 500);
    }
  });
