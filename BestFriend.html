<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg: #0a0015;
      --pink: #ff4d8d;
      --purple: #a855f7;
      --gold: #fbbf24;
      --cyan: #06b6d4;
      --text: #fce7f3;
      --glass: rgba(15, 0, 30, 0.75);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 30% 10%, #1a0040 0%, transparent 55%),
        radial-gradient(ellipse at 70% 90%, #0d0025 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, #150030 0%, transparent 60%);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Летающие частицы */
    .particles {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatUp 7s infinite ease-in;
      opacity: 0;
    }
    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0); opacity: 0; }
      15% { opacity: 0.9; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1.6); opacity: 0; }
    }

    .scene {
      width: 100%; max-width: 750px;
      padding: 20px; position: relative;
      z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }

    /* Секции */
    .section {
      display: none; width: 100%;
      flex-direction: column; align-items: center;
      text-align: center;
      animation: fadeSlide 0.7s ease-out;
    }
    .section.active { display: flex; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Заставка */
    .intro-title {
      font-family: 'Pacifico', cursive;
      font-size: 36px;
      color: #fff;
      text-shadow: 0 0 20px var(--pink), 0 0 50px var(--pink), 0 0 80px var(--purple);
      margin-bottom: 30px;
      line-height: 1.4;
    }
    .intro-hearts {
      font-size: 50px;
      margin-bottom: 20px;
      animation: heartFloat 2s infinite ease-in-out;
    }
    @keyframes heartFloat {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.08); }
    }

    .btn {
      padding: 16px 40px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
      border: none;
    }
    .btn:active { transform: scale(0.95); }

    .btn-primary {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: #fff;
      box-shadow: 0 8px 40px rgba(255,77,141,0.5);
    }
    .btn-ghost {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.4);
      color: #fce7f3;
    }
    .btn-ghost:hover { border-color: var(--pink); }

    .btn-skip {
      position: relative;
      transition: all 0.15s ease-out;
    }

    /* Вопрос */
    .question-text {
      font-family: 'Russo One', sans-serif;
      font-size: 28px;
      color: #fff;
      text-shadow: 0 0 25px var(--purple);
      margin: 25px 0;
      letter-spacing: 2px;
    }

    .btn-group { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }

    /* Котики */
    .cat-img {
      font-size: 100px;
      margin: 20px 0;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    .cat-msg {
      font-size: 22px;
      font-weight: 700;
      color: #fce7f3;
      margin: 10px 0;
    }

    /* Терминал */
    .terminal {
      background: #000a00;
      border: 2px solid #33ff33;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      min-height: 200px;
      box-shadow: 0 0 35px rgba(51,255,51,0.3);
      font-family: 'Press Start 2P', monospace;
      color: #33ff33;
      font-size: 12px;
      line-height: 2;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
    }
    .cursor::after { content: "_"; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }

    /* Сердце загрузка */
    .heart-loader {
      font-size: 80px;
      margin: 25px 0;
      filter: drop-shadow(0 0 30px #ff3366);
    }
    .progress-bar {
      width: 85%;
      max-width: 400px;
      height: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 20px;
      overflow: hidden;
      margin: 10px 0;
      border: 2px solid #ff4d8d;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff3366, #ff6b9d, #ff3366);
      border-radius: 20px;
      transition: width 0.3s ease;
    }
    .progress-text {
      color: #fce7f3;
      font-weight: 700;
      font-size: 18px;
    }

    /* Хартс экран */
    .hearts-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 35px;
      margin: 25px 0;
    }
    .dedication-text {
      font-family: 'Pacifico', cursive;
      font-size: 28px;
      color: #fff;
      text-shadow: 0 0 25px var(--pink), 0 0 50px var(--pink);
      margin: 15px 0;
    }

    /* Плеер */
    .player-box {
      background: var(--glass);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 35px;
      padding: 30px 18px;
      border: 1.5px solid rgba(255,255,255,0.2);
      width: 100%;
    }
    .now-playing {
      color: var(--gold);
      font-weight: 700;
      font-size: 15px;
      margin: 8px 0;
    }
    audio { width: 100%; max-width: 400px; border-radius: 30px; margin: 10px 0; }
    .lyrics-box {
      background: rgba(0,0,0,0.55);
      border-radius: 20px;
      padding: 16px;
      margin: 12px 0;
      max-height: 130px;
      overflow-y: auto;
      color: #f5d0fe;
      font-weight: 600;
      font-size: 17px;
      line-height: 1.8;
      border: 1px solid #a78bfa;
    }
    .highlight-lyric {
      color: #fbbf24;
      font-weight: 800;
      background: rgba(168,85,247,0.3);
      border-radius: 8px;
      padding: 3px 10px;
    }

    /* Финальные слова */
    .final-box {
      background: linear-gradient(160deg, #1a001a, #0d0015);
      border-radius: 30px;
      padding: 30px 20px;
      border: 2px solid #ff4d6d;

      overflow-y: auto;
      color: #fce4ec;
      font-size: 15px;
      line-height: 2;
      text-align: left;
    }
    .final-box ol { padding-left: 25px; }
    .final-box li { margin-bottom: 8px; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
  </style>
</head>

    "91. Ты особенная, и ты должна это знать.",
    "92. Ты уникальная, таких больше нет.",
    "93. Ты — свет в конце тоннеля.",
    "94. Ты — мой safe place.",
    "95. Ты — человек, которому я благодарен каждый день.",
    "96. Ты делаешь этот мир лучше.",
    "97. Ты достойна всей любви, что есть во вселенной.",
    "98. Ты — лучшее, что случилось со мной за долгое время.",
    "99. Ты — мой бриллиант, моя звезда, моя гордость.",
    "100. Я рад, что познакомился с тобой, Тори. Навсегда ❤️"
  ];

  // ===== НАВИГАЦИЯ =====
  function showSection(sec) {
    [secIntro,secQuestion,secCat,secTerminal,secHeartLoad,secHearts,secPlayer,secFinal]
      .forEach(s => s.classList.remove('active'));
    sec.classList.add('active');
    sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ===== 1. ЗАСТАВКА → ВОПРОС =====
  document.getElementById('btnAsk').addEventListener('click', () => showSection(secQuestion));

  // Убегающая кнопка
  const btnSkip = document.getElementById('btnSkip');
  btnSkip.addEventListener('mouseover', moveSkip);
  btnSkip.addEventListener('touchstart', function(e) {
    e.preventDefault();
    moveSkip();
    // Если тапнули — всё равно перекидываем на вопрос (мисклик)
    setTimeout(() => showSection(secQuestion), 300);
  });
  btnSkip.addEventListener('click', () => showSection(secQuestion));

  function moveSkip() {
    const maxX = window.innerWidth - btnSkip.offsetWidth - 30;
    const maxY = window.innerHeight - btnSkip.offsetHeight - 30;
    const rx = Math.random() * maxX;
    const ry = Math.random() * maxY;
    btnSkip.style.position = 'fixed';
    btnSkip.style.left = rx + 'px';
    btnSkip.style.top = ry + 'px';
    btnSkip.style.zIndex = '999';
  }

  // ===== 2. ВОПРОС → ДА / НЕТ =====
  document.getElementById('btnYes').addEventListener('click', () => {
    showSection(secCat);
    document.getElementById('catEmoji').textContent = '😸';
    document.getElementById('catMsg').textContent = 'Я не сомневался! ❤️';
    document.getElementById('btnContinue').style.display = 'inline-block';
  });

  document.getElementById('btnNo').addEventListener('click', () => {
    const msgDiv = document.getElementById('noMsg');
    msgDiv.style.display = 'block';
    msgDiv.innerHTML = '<div class="cat-img">😿</div><div class="cat-msg">Подумай ещё, пожалуйста...</div>';
    // Прячем кнопку Нет и оставляем только Да
    document.getElementById('btnNo').style.display = 'none';
    document.getElementById('btnYes').textContent = 'Да, ты мой лучший друг! ❤️';
  });

  // ===== 3. КОТИК → ТЕРМИНАЛ =====
  document.getElementById('btnContinue').addEventListener('click', () => {
    showSection(secTerminal);
    startTerminal();
  });

  // ===== 4. ТЕРМИНАЛ =====
  async function startTerminal() {
    terminalDisplay.innerHTML = '<span class="cursor"></span>';
    const lines = [
      "root@bestfriend:~$ init sequence",
      "Загрузка модуля Tori...",
      "Загрузка модуля Kostia...",
      "Вычисление: Tori + Kostia = ?",
      "",
      "Выберите вариант:",
      "1. best+friend",
      "2. no friend"
    ];
    for (let i=0; i<lines.length; i++) {
      terminalDisplay.innerHTML = lines.slice(0,i+1).join('\n') + '<span class="cursor"></span>';
      await sleep(250);
    }
    termBtns.style.display = 'flex';
  }

  termBtns.addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON') return;
    const choice = e.target.dataset.choice;
    if (choice === '1') {
      termBtns.style.display = 'none';
      termError.style.display = 'none';
      terminalDisplay.innerHTML += '\n\n>>> Tori + Kostia = ЛУЧШИЕ ДРУЗЬЯ ❤️\n>>> Загрузка...';
      setTimeout(() => showSection(secHeartLoad), 1500);
      startHeartLoading();
    } else {
      termError.style.display = 'block';
      termError.textContent = '⚠ Ошибка! Выберите вариант 1';
    }
  });

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ===== 5. ЗАГРУЗКА СЕРДЦА =====
  function startHeartLoading() {
    let percent = 0;
    const interval = setInterval(() => {
      percent += Math.floor(Math.random()*8)+1;
      if (percent >= 100) {
        percent = 100;
        clearInterval(interval);
        progressFill.style.width = '100%';
        progressText.textContent = '100% ❤️';
        setTimeout(() => {
          showSection(secHearts);
          fillHearts();
        }, 800);
      } else {
        progressFill.style.width = percent+'%';
        progressText.textContent = percent+'%';
      }
    }, 250);
  }

  // ===== 6. ЭКРАН СЕРДЕЧЕК =====
  function fillHearts() {
    let html = '';
    for (let i=0; i<50; i++) {
      const emojis = ['❤️','💖','💗','💕','💘','💝','💟','♥️','🩷','💓'];
      html += `<span>${emojis[Math.floor(Math.random()*emojis.length)]}</span>`;
    }
    heartsGrid.innerHTML = html;
  }

  // ===== 7. ПЛЕЕР =====
  document.getElementById('btnPlayMusic').addEventListener('click', () => {
    showSection(secPlayer);
    loadSong(0);
  });

  function loadSong(idx) {
    currentSong = idx;
    const s = songs[idx];
    audioPlayer.src = s.src;
    nowPlaying.textContent = '▶ ' + s.name;
    lyricsDisplay.innerHTML = '🎤 нажми play';
  }

  audioPlayer.addEventListener('timeupdate', () => {
    const s = songs[currentSong];
    const ct = audioPlayer.currentTime;
    let line = '';
    for (let i=s.lyrics.length-1; i>=0; i--) {
      if (ct >= s.lyrics[i].t) { line = s.lyrics[i].l; break; }
    }
    lyricsDisplay.innerHTML = line
      ? `<span class="highlight-lyric">${line}</span>`
      : '🎵 ...';

    // Автопереключение на вторую песню
    if (currentSong === 0 && ct >= s.nextSongAt && songs[1].src) {
      loadSong(1);
      audioPlayer.play().catch(()=>{});
      nowPlaying.textContent = '▶ ' + songs[1].name + ' (авто)';
    }
  });

  // ===== 8. ФИНАЛ =====
  document.getElementById('btnFinal').addEventListener('click', () => {
    showSection(secFinal);
    finalWords.innerHTML = '<ol>' + hundredWords.map(w => '<li>'+w.replace(/^\d+\.\s/,'')+'</li>').join('') + '</ol>';
  });

  // ===== СБРОС УБЕГАЮЩЕЙ КНОПКИ =====
  window.addEventListener('resize', () => {
    btnSkip.style.position = '';
    btnSkip.style.left = '';
    btnSkip.style.top = '';
    btnSkip.style.zIndex = '';
  });

})();
</script>
</body>
  </html>
